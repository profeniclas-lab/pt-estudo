<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PORTUGUÊS-ESTUDO v1.0 — Português e Redação Oficial</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <button class="menu-toggle" data-action="toggle-sidebar" aria-label="Abrir menu">☰</button>
      <div class="brand">
        <span id="brandName">PORTUGUÊS-ESTUDO</span>
        <span class="brand-sub" id="brandSubtitle">Português e Redação Oficial para Concursos</span>
      </div>
      <div class="header-spacer"></div>
      <span class="version-badge" id="appVersionBadge">v1.0</span>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="nav-section-title">Estudo</div>
      <button class="nav-item" data-nav="dashboard"><span class="nav-icon">🏠</span><span>Dashboard</span></button>
      <button class="nav-item" data-nav="modulos"><span class="nav-icon">📚</span><span>Módulos</span></button>
      <button class="nav-item" data-nav="questoes"><span class="nav-icon">📝</span><span>Questões</span></button>
      <button class="nav-item" data-nav="banco-questoes"><span class="nav-icon">🗄️</span><span>Banco de Questões</span></button>
      <button class="nav-item" data-nav="flashcards"><span class="nav-icon">🗂️</span><span>Flashcards</span></button>

      <div class="nav-section-title">Revisão</div>
      <button class="nav-item" data-nav="revisao"><span class="nav-icon">🔁</span><span>Revisão</span><span class="nav-badge" id="navBadgeRevisao" style="display:none;"></span></button>
      <button class="nav-item" data-nav="erros"><span class="nav-icon">❌</span><span>Meus Erros</span><span class="nav-badge" id="navBadgeErros" style="display:none;"></span></button>

      <div class="nav-section-title">Simulados</div>
      <button class="nav-item" data-nav="simulados"><span class="nav-icon">🎯</span><span>Simulados</span></button>

      <div class="nav-section-title">Progresso</div>
      <button class="nav-item" data-nav="estatisticas"><span class="nav-icon">📊</span><span>Estatísticas</span></button>

      <div class="nav-section-title">Sistema</div>
      <button class="nav-item" data-nav="configuracoes"><span class="nav-icon">⚙️</span><span>Configurações</span></button>
      <button class="nav-item" data-nav="sobre"><span class="nav-icon">ℹ️</span><span>Sobre</span></button>
    </aside>

    <main class="main" id="main"></main>
  </div>

  <!-- Configuração — deve vir PRIMEIRO -->
  <script src="config.js"></script>

  <!-- Conteúdo base -->
  <script src="content/modules.js"></script>
  <script src="content/lessons-alta.js"></script>
  <script src="content/lessons-media.js"></script>
  <script src="content/lessons-complementar.js"></script>
  <script src="content/diagnostics-alta.js"></script>
  <script src="content/diagnostics-media.js"></script>
  <script src="content/diagnostics-complementar.js"></script>
  <script src="content/questions.js"></script>
  <script src="content/flashcards.js"></script>

  <!-- Melhorias pedagógicas -->
  <script src="content/exercises.js"></script>
  <script src="content/exemplos-ineditos.js"></script>

  <!-- Motor — deve vir por ÚLTIMO -->
  <script src="app.js"></script>
</body>
</html>
